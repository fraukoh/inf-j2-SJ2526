<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BubbleSort – Präsentation</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --fg: #1f2937;
      --accent: #2563eb;
      --panel: rgba(255, 255, 255, 0.92);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      height: calc(100% - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #slide {
      max-width: min(96vw, 1400px);
      max-height: 100%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    #slide svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }
    #toolbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-top: 1px solid #e5e7eb;
    }
    button {
      appearance: none;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--fg);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #counter {
      min-width: 90px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    #status {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
      text-align: center;
    }
    #status.visible { display: flex; }
    .hint {
      position: fixed;
      top: 12px;
      right: 16px;
      font-size: 13px;
      color: #6b7280;
      background: var(--panel);
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 12px;
    }
    a.back {
      position: fixed;
      top: 12px;
      left: 16px;
      text-decoration: none;
      color: var(--fg);
      background: var(--panel);
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <a class="back" href="javascript:history.back()">← Zurück</a>
  <div class="hint">← → oder Klick · F Vollbild</div>
  <div id="status" class="visible">Präsentation wird geladen…</div>
  <div id="stage"><div id="slide"></div></div>
  <div id="toolbar">
    <button id="prev" type="button">◀ Zurück</button>
    <div id="counter">– / –</div>
    <button id="next" type="button">Weiter ▶</button>
  </div>

  <script type="module">
    const SCENE_URL = "BubbleSort.excalidraw";
    const statusEl = document.getElementById("status");
    const slideEl = document.getElementById("slide");
    const counterEl = document.getElementById("counter");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add("visible");
    }
    function hideStatus() {
      statusEl.classList.remove("visible");
      statusEl.textContent = "";
    }

    let frames = [];
    let svgs = [];
    let index = 0;

    function updateUi() {
      counterEl.textContent = `${index + 1} / ${svgs.length}`;
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= svgs.length - 1;
      slideEl.innerHTML = "";
      if (svgs[index]) slideEl.appendChild(svgs[index].cloneNode(true));
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= svgs.length) return;
      index = next;
      updateUi();
    }

    prevBtn.addEventListener("click", () => go(-1));
    nextBtn.addEventListener("click", () => go(1));
    slideEl.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        go(1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        go(-1);
      } else if (e.key === "Home") {
        index = 0;
        updateUi();
      } else if (e.key === "End") {
        index = svgs.length - 1;
        updateUi();
      } else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    try {
      const { exportToSvg } = await import("https://esm.sh/@excalidraw/excalidraw@0.18.0");
      const scene = await fetch(SCENE_URL).then((r) => {
        if (!r.ok) throw new Error("Excalidraw-Datei nicht gefunden: " + SCENE_URL);
        return r.json();
      });

      const elements = (scene.elements || []).filter((el) => !el.isDeleted);
      frames = elements
        .filter((el) => el.type === "frame")
        .sort((a, b) => String(a.index || "").localeCompare(String(b.index || "")));

      if (frames.length === 0) {
        // Keine Frames: ganze Zeichnung als eine Folie
        frames = [{ id: "__all__", __all: true }];
      }

      showStatus(`Rendere ${frames.length} Folie(n)…`);

      for (const frame of frames) {
        let frameElements;
        let exportingFrame = undefined;
        if (frame.__all) {
          frameElements = elements;
        } else {
          frameElements = elements.filter(
            (el) => el.id === frame.id || el.frameId === frame.id
          );
          exportingFrame = frame;
        }

        const svg = await exportToSvg({
          elements: frameElements,
          files: scene.files || {},
          appState: {
            exportBackground: true,
            viewBackgroundColor: (scene.appState && scene.appState.viewBackgroundColor) || "#ffffff",
            exportWithDarkMode: false,
            frameRendering: {
              enabled: true,
              name: false,
              outline: false,
              clip: true,
            },
          },
          exportPadding: 16,
          exportingFrame,
        });

        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.maxWidth = "100%";
        svg.style.maxHeight = "100%";
        svgs.push(svg);
      }

      hideStatus();
      updateUi();
    } catch (err) {
      console.error(err);
      showStatus("Präsentation konnte nicht geladen werden.\n" + (err && err.message ? err.message : err));
    }
  </script>
</body>
</html>
